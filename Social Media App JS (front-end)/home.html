<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <!-- IMPORT BOOTSTRAP -->
     <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<style>
    body{
         background: linear-gradient(135deg, #1e1e1e, #301d3d);
         color: #ffffff;
         /* background-color: beige; */
         margin: 0;
    }
    .btn:hover {
    transform: scale(1.2);
    transition: all 0.5s ease;
}
</style>
<body>
    <!-- ALERTS -->
        <div id="LoginAlert" class="show fade" style="position: fixed; bottom: 0px; right:0px ;"></div>
        <div id="LogoutAlert" class="show fade" style="position: fixed; bottom: 0px; right:0px ;"></div>
            <div id="CreatePostAlert" class="show fade" style="position: fixed; bottom: 0px; right:0px ;"></div>
            <div id="EditPostAlert" class="show fade" style="position: fixed; bottom: 0px; right:0px ;"></div>
        <!--//ALERTS  -->
        <!-- ==========MODALS========= -->
       <!-- Login Modal -->
        <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true" style="display: none;" data-bs-theme="dark">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Login</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                        <div class="mb-3">
                            <label for="username-input" class="col-form-label">Username</label>
                            <input type="text" class="form-control" id="username-input">
                        </div>
                        <div class="mb-3">
                            <label for="password-input" class="col-form-label">Password</label>
                            <input type="password" class="form-control" id="password-input"></input>
                        </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        
                        <button id="login" type="button" class="btn btn-primary" data-bs-dismiss="modal">Login</button>
                    </div>
                </div>
            </div>
        </div>
         <!-- //Login Modal -->
        <!-- SignUp Modal -->
        <div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true" style="display: none ;" data-bs-theme="dark" >
            <div class="modal-dialog">
                <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Signup</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                    <div class="modal-body">
                        <form>
                         <div>
                            <label class="btn btn-light">
                                <input id="profileImage" type="file">
                                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-file-person" viewBox="0 0 16 16">
                                <path d="M12 1a1 1 0 0 1 1 1v10.755S12 11 8 11s-5 1.755-5 1.755V2a1 1 0 0 1 1-1zM4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                                <path d="M8 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                                </svg>
                            </label>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="col-form-label">Full Name</label>
                            <input type="text" class="form-control" id="name">
                        </div>   
                        <div class="mb-3">
                            <label for="new_username" class="col-form-label">Username</label>
                            <input type="text" class="form-control" id="new_username">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="col-form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="mb-3">
                            <label for="new_password" class="col-form-label">Password</label>
                            <input type="password" class="form-control" id="new_password"></input>
                        </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button id="signup" type="button" class="btn btn-primary" data-bs-dismiss="modal">Signup</button>
                    </div>
                </div>
            </div>
        </div>
       <!-- //SignUp Modal -->

       <!-- Create Post Modal -->
        <div class="modal fade" id="CreatePostModal" tabindex="-1" aria-labelledby="CreatePostModalLabel" aria-hidden="true" style="display: none ;" data-bs-theme="dark" >
            <div class="modal-dialog">
                <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Create New Post</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                    <div class="modal-body">
                        <form>
                        <div class="mb-3">
                            <textarea class="form-control mb-2"id="postBody" placeholder="What's on your mind?"></textarea>
                        </div>   
                        </form>
                    </div>
                    <div class="modal-footer d-flex justify-content-between">              
                        <label class="btn btn-light">
                            <input id="postImage" type="file">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-file-earmark-image" viewBox="0 0 16 16">
                            <path d="M6.502 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/>
                            <path d="M14 14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zM4 1a1 1 0 0 0-1 1v10l2.224-2.224a.5.5 0 0 1 .61-.075L8 11l2.157-3.02a.5.5 0 0 1 .76-.063L13 10V4.5h-2A1.5 1.5 0 0 1 9.5 3V1z"/>
                            </svg>
                        </label>
                        <button class="btn btn-primary" id="createPost">Post</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- //Create Post Modal -->     

        <!-- Edit Post Modal -->
        <div class="modal fade" id="EditPostModal" tabindex="-1" aria-labelledby="EditPostModalLabel" aria-hidden="true" style="display: none ;" data-bs-theme="dark" >
            <div class="modal-dialog">
                <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Edit Post</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                    <div class="modal-body">
                        <form>
                        <div class="mb-3">
                            <textarea class="form-control mb-2"id="newpostBody"></textarea>
                        </div>   
                        </form>
                    </div>
                    <div class="modal-footer d-flex justify-content-between">              
                        <label class="btn btn-light">
                            <input id="newpostImage" type="file">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-file-earmark-image" viewBox="0 0 16 16">
                            <path d="M6.502 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/>
                            <path d="M14 14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zM4 1a1 1 0 0 0-1 1v10l2.224-2.224a.5.5 0 0 1 .61-.075L8 11l2.157-3.02a.5.5 0 0 1 .76-.063L13 10V4.5h-2A1.5 1.5 0 0 1 9.5 3V1z"/>
                            </svg>
                        </label>
                        <button class="btn btn-primary" id="editPost">Edit</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- //Edit Post Modal -->    
    <!-- ==========//MODALS======= -->

    <!-- NAV BAR CONT -->
    <div class="d-flex">

        <div style="height: 100vh; position: fixed; top: 0;" >

                                <path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z"/>
                                <path fill-rule="evenodd" d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                            </svg>
                        </button>
                        <button class="btn btn-dark mt-3" type="submit" data-bs-toggle="modal" data-bs-target="#signupModal">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-door-open" viewBox="0 0 16 16">
                            <path d="M8.5 10c-.276 0-.5-.448-.5-1s.224-1 .5-1 .5.448.5 1-.224 1-.5 1"/>
                            <path d="M10.828.122A.5.5 0 0 1 11 .5V1h.5A1.5 1.5 0 0 1 13 2.5V15h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3V1.5a.5.5 0 0 1 .43-.495l7-1a.5.5 0 0 1 .398.117M11.5 2H11v13h1V2.5a.5.5 0 0 0-.5-.5M4 1.934V15h6V1.077z"/>
                            </svg>
                        </button>
                    </div>

                </div>       
            </nav>
        </div>

             <div style="position: fixed; z-index: 1; width: 100vw;" >
                <!-- NAV BAR -->

                    </div>
                    <form class="d-flex w-25" role="search">
                            <input id="searchBar" class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                            <button id="searchBtn" class="btn btn-dark" type="submit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">

                    <div id="currentUser" class="d-flex align-items-center justify-content-end w-25 px-3 mx-3">
                        <img class="border border-1 rounded-circle" style="width: 2vw; height: 4vh;" src="./pictures/user-profile.webp">
